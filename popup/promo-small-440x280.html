<!DOCTYPE html>
<html dir="ltr" lang="ar">
<head>
<meta charset="utf-8"/>
<title>Promo small 440x280</title>
<link rel="stylesheet" href="popup.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 440px; height: 280px; overflow: hidden;
    background: linear-gradient(120deg, #0B0F0E 0%, #10241D 60%, #16352A 100%);
    color: #E0E3E5; font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", sans-serif;
    display: flex; align-items: center; padding: 0 30px; gap: 22px;
  }
  .icon { width: 96px; height: 96px; border-radius: 24px; flex: none; }
  .txt { min-width: 0; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; color: #FFFFFF; }
  .tag { font-size: 16px; color: #2FA98C; font-weight: 600; line-height: 1.5; }
  .feat { font-size: 13px; color: #94A3B8; margin-top: 8px; }
</style>
</head>
<body>
  <img class="icon" src="../icons/128-store.png" alt="">
  <div class="txt">
    <h1>Fluent Arabic Web - RTL</h1>
    <div class="tag">منسق النصوص العربية على أي موقع ويب</div>
    <div class="feat">تصحيح تلقائي · خطوط عربية مدمجة · حماية التخطيط</div>
  </div>
</body>
</html>
