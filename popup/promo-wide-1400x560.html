<!DOCTYPE html>
<html dir="ltr" lang="ar">
<head>
<meta charset="utf-8"/>
<title>Promo marshmallow 1400x560</title>
<link rel="stylesheet" href="popup.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1400px; height: 560px; overflow: hidden;
    background: linear-gradient(115deg, #0B0F0E 0%, #10241D 50%, #16352A 100%);
    color: #E0E3E5; font-family: "Segoe UI", Tahoma, "Noto Kufi Arabic", sans-serif;
    display: flex; align-items: center; padding: 0 90px; gap: 80px;
  }
  .left { flex: 1; min-width: 0; }
  .icon { width: 170px; height: 170px; border-radius: 40px; margin-bottom: 26px; display: block; }
  h1 { font-size: 46px; font-weight: 700; margin: 0 0 8px; color: #FFFFFF; }
  .tagline {
    font-size: 26px; color: #2FA98C; font-weight: 600; margin-bottom: 26px;
    border-inline-start: 4px solid #2FA98C; padding-inline-start: 16px;
  }
  .features { font-size: 19px; color: #94A3B8; line-height: 1.7; margin: 0; padding: 0; list-style: none; }
  .features li::before { content: "•"; color: #2FA98C; font-weight: 700; margin-inline-end: 10px; }
  .shot {
    width: 300px; height: auto; display: block; border-radius: 20px;
    box-shadow: 0 36px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(148,163,184,0.18);
    transform: rotate(-1deg); flex: none;
  }
</style>
</head>
<body>
  <div class="left">
    <img class="icon" src="../icons/128-store.png" alt="">
    <h1>Fluent Arabic Web - RTL</h1>
    <div class="tagline">منسق النصوص العربية على أي موقع ويب</div>
    <ul class="features">
      <li>تصحيح تلقائي لاتجاه النصوص العربية بدون كسر التخطيط</li>
      <li>خطوط عربية مدمجة + لوحة تحكم متكاملة</li>
      <li>Profiles جاهزة: ChatGPT وClaude وGrok وGoogle AI Studio</li>
    </ul>
  </div>
  <img class="shot" src="popup-crop.png" alt="واجهة الإضافة">
</body>
</html>
