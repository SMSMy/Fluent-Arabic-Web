<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">صورة مقترحة لمشروع Fluent Arabic Web</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">رسم توضيحي لنافذة متصفح مقسّمة إلى قسمين: على اليسار نص عربي غير منسق قبل استخدام الإضافة، وعلى اليمين نفس النص بعد تصحيح اتجاهه إلى اليمين، مع شارة دائرية في المنتصف ترمز إلى عمل الإضافة.</desc>
